# ==============================================================================
#                      ☕ CoffeeProtect - Configuration File ☕
#       Advanced Next-Generation Anti-Crash & Exploit Protection System
# ==============================================================================

# General settings
settings:
  # Enable debug mode in console
  debug: false
  # Reset violation points interval in seconds (default: 300s = 5m)
  violation_reset_interval: 300
  # Automatically cancel detected malicious packets
  cancel_malicious_packets: true

# Exploit Checks Configuration
checks:
  # Book Exploit Check (Prevents crash books, malicious JSON tags, oversized pages)
  book:
    enabled: true
    max_pages: 50
    max_bytes_per_page: 2048
    max_total_bytes: 65536
    block_invalid_characters: true
    block_json_translations: true
    cancel_packet: true
    action: "kick {player} [CoffeeProtect] Malicious Book Exploit Detected"

  # Sign Exploit Check (Prevents malicious sign clickEvents and oversized text)
  sign:
    enabled: true
    max_line_length: 384
    block_command_execution: true
    cancel_packet: true
    action: "kick {player} [CoffeeProtect] Malicious Sign Exploit Detected"

  # Creative Slot & Item NBT Check (Prevents hacked items, infinite NBT depth, crash skulls)
  creative_slot:
    enabled: true
    max_nbt_depth: 16
    max_nbt_size_bytes: 32768
    max_enchantment_level: 255
    validate_skull_urls: true
    cancel_packet: true
    action: "kick {player} [CoffeeProtect] Illegal Item/NBT Exploit Detected"

  # Custom Payload / Plugin Message Check (Prevents channel flood and memory overflow)
  custom_payload:
    enabled: true
    max_payload_size: 32767
    max_channels_registered: 128
    block_invalid_channels: true
    cancel_packet: true
    action: "kick {player} [CoffeeProtect] Custom Payload Overflow Detected"

  # Window Click & Inventory Exploit Check (Prevents impossible slot clicks and click spam)
  window_click:
    enabled: true
    max_clicks_per_second: 30
    block_impossible_slots: true
    cancel_packet: true
    action: "kick {player} [CoffeeProtect] Inventory Click Flood Detected"

  # Movement & Position Exploit Check (Prevents NaN coordinates, Infinity, crash teleports)
  movement:
    enabled: true
    max_coordinate: 30000000.0
    block_nan_coordinates: true
    block_extreme_angles: true
    cancel_packet: true
    action: "kick {player} [CoffeeProtect] Invalid Position Packet Detected"

  # Redstone & Clock Lag Machine Check (Prevents runaway redstone clocks causing server TPS drop)
  redstone:
    enabled: true
    max_updates_per_chunk_per_tick: 250
    pause_clock_duration_seconds: 30
    notify_staff: true

# In-game Alerts & Notifications
alerts:
  enabled: true
  # Format of alert message sent to staff with 'coffeeprotect.alerts'
  format: "&8[&6☕ CoffeeProtect&8] &c{player} &7failed &e{check} &7(&cVL: {vl}&7, &fPing: {ping}ms&7)"
  # Cooldown between in-game alerts for the same player (seconds)
  cooldown_seconds: 3

# Discord Webhook Integration
discord:
  enabled: false
  webhook_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_URL_HERE"
  embed:
    title: "☕ CoffeeProtect - Exploit Alert"
    color: "#E67E22"
    fields:
      - name: "Player"
        value: "`{player}`"
        inline: true
      - name: "Check"
        value: "`{check}`"
        inline: true
      - name: "Ping"
        value: "`{ping} ms`"
        inline: true
      - name: "Violation Level"
        value: "`{vl}`"
        inline: true
      - name: "Server TPS"
        value: "`{tps}`"
        inline: true
      - name: "Action Taken"
        value: "`{action}`"
        inline: true
    footer: "CoffeeProtect v2.5.6 • Server Security"

# System Messages
messages:
  prefix: "&8[&6☕ CoffeeProtect&8] "
  no_permission: "&cYou do not have permission to execute this command."
  reload_success: "&aConfiguration and exploit checks reloaded successfully! (Took {time}ms)"
  alerts_toggled_on: "&aExploit alerts enabled for you."
  alerts_toggled_off: "&cExploit alerts disabled for you."
  player_not_found: "&cPlayer '{target}' not found or is offline."
  player_info:
    - "&8&m----------------------------------------"
    - "&6☕ CoffeeProtect &7- Player Security Info: &e{player}"
    - "&7• Client Brand: &f{brand}"
    - "&7• Network Ping: &f{ping} ms"
    - "&7• Total Violations: &c{total_vl}"
    - "&7• Blocked Packets: &e{blocked_packets}"
    - "&8&m----------------------------------------"
