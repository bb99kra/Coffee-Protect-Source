name: CoffeeProtect
version: 2.5.6
main: me.nik.coffeeprotect.CoffeeProtect
api-version: 1.20
prefix: CoffeeProtect
authors: [ Nik, Nguyendzvn ]
description: An advanced next-generation anti-crash and exploit protection plugin for Minecraft
folia-supported: true
softdepend:
  - packetevents
  - PlaceholderAPI
  - ProtocolLib
commands:
  coffeeprotect:
    description: The main CoffeeProtect command
    aliases: [ cp ]
    permission: coffeeprotect.admin
permissions:
  coffeeprotect.admin:
    description: Gives access to all admin commands
    default: op
  coffeeprotect.reload:
    description: Gives access to reload CoffeeProtect
    default: op
  coffeeprotect.alerts:
    description: Gives access to receive exploit alert notifications
    default: op
  coffeeprotect.logs:
    description: Gives access to view player exploit logs
    default: op
  coffeeprotect.menu:
    description: Gives access to the CoffeeProtect admin GUI menu
    default: op
  coffeeprotect.info:
    description: Gives access to inspect a player's network and client info
    default: op
